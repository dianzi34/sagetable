name: Vercel Deploy Preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  preview:
    name: Vercel Preview
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel Git Integration
        run: |
          echo "Vercel preview deployment is managed automatically via Vercel Git Integration."
          echo "PR preview deployments and checks are handled directly by the Vercel bot."
